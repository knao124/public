<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>knao124 public</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4efe6;
        --panel: rgba(255, 252, 246, 0.92);
        --text: #1f2937;
        --muted: #5b6470;
        --accent: #0f766e;
        --border: #e7dcc9;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(15, 118, 110, 0.14), transparent 28%),
          radial-gradient(circle at bottom right, rgba(180, 83, 9, 0.1), transparent 24%),
          linear-gradient(180deg, #efe4d2 0%, var(--bg) 100%);
      }

      main {
        width: min(820px, 100%);
        padding: 40px 32px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--panel);
        box-shadow: 0 20px 48px rgba(31, 41, 55, 0.1);
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--accent);
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2rem, 5vw, 3.25rem);
        line-height: 1.1;
      }

      .muted {
        color: var(--muted);
      }

      .table-wrap {
        margin-top: 20px;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.72);
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      thead th {
        padding: 14px 18px;
        text-align: left;
        font-size: 0.88rem;
        letter-spacing: 0.04em;
        color: var(--muted);
        background: rgba(15, 118, 110, 0.08);
      }

      tbody td {
        padding: 16px 18px;
        vertical-align: top;
        border-top: 1px solid var(--border);
      }

      tbody tr:hover {
        background: rgba(255, 255, 255, 0.68);
      }

      .published-at {
        width: 230px;
        white-space: nowrap;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .page-link a {
        color: var(--accent);
        font-weight: 700;
      }

      @media (max-width: 640px) {
        main {
          padding: 28px 18px;
        }

        thead {
          display: none;
        }

        table,
        tbody,
        tr,
        td {
          display: block;
          width: 100%;
        }

        tbody td {
          padding: 10px 16px;
          border-top: none;
        }

        tbody tr {
          padding: 8px 0 12px;
          border-top: 1px solid var(--border);
        }

        .published-at {
          padding-bottom: 0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">GitHub Pages</p>
      <h1>Page 一覧</h1>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>公開日時</th>
              <th>Page</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="published-at">2026-05-13 10:12 JST</td>
              <td class="page-link">
                <a href="./jahis-prescription-qr-format-v1-11.html">JAHIS 院外処方箋2次元シンボル Ver.1.11 CSV解説</a>
              </td>
            </tr>
            <tr>
              <td class="published-at">2026-05-13 10:06 JST</td>
              <td class="page-link">
                <a href="./codex-web-tailscale-remote-access-guide.html">codex-web を Tailscale 越しに使うための解説</a>
              </td>
            </tr>
            <tr>
              <td class="published-at">2026-05-13 09:58 JST</td>
              <td class="page-link">
                <a href="./static-html-publishing-guide.html">静的HTMLの公開手段まとめ</a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>
</html>
